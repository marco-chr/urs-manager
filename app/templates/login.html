<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — URS Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background: #f0f4f8; }
    .login-card { max-width: 400px; margin: 8vh auto; }
    .brand-header { background: #0d6efd; color: white; padding: 2rem; border-radius: .5rem .5rem 0 0; text-align: center; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand-header">
    <i class="bi bi-file-earmark-text fs-1"></i>
    <h3 class="mt-2 mb-0">URS Manager</h3>
    <small class="text-white-50">Pharmaceutical & Industrial Automation</small>
  </div>
  <div class="card border-0 shadow-sm" style="border-radius: 0 0 .5rem .5rem">
    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" autofocus required/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>
    </div>
  </div>
  <p class="text-center text-muted mt-3 small">Default: admin / admin123 — change on first login</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
